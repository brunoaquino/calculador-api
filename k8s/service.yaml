# ClusterIP: a API só tem endereço dentro do cluster.
apiVersion: v1
kind: Service
metadata:
  name: calculador-api
  labels:
    app.kubernetes.io/name: calculador-api
    app.kubernetes.io/part-of: calculador
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calculador-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
      appProtocol: http
