# Aplicar com `kubectl apply -k k8s/` (o namespace vem do kustomization).
# A imagem `calculador-api` é reescrita pelo bloco images do kustomization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculador-api
  labels:
    app.kubernetes.io/name: calculador-api
    app.kubernetes.io/part-of: calculador
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: calculador-api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: calculador-api
        app.kubernetes.io/part-of: calculador
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: calculador-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Preferência de nós distintos. Não é obrigatória: no kind de um nó as duas réplicas agendam.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: calculador-api
      containers:
        - name: calculador-api
          image: calculador-api:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: calculador-api
          env:
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: calculador-api
                  key: NODE_OPTIONS
          # Cadeia de memória: limit 256Mi > max-old-space-size 160 > readiness 144 MiB.
          # O readiness falha antes do teto do V8 e bem antes do OOM do cgroup.
          # Request 192Mi ≈ RSS sob carga (~141MiB) + 20%. Memória não é comprimível:
          # o request cobre o pico para o scheduler não superlotar o nó.
          # CPU é comprimível: ociosa fica em ~0m e 50 conexões em saturação usam ~1350m.
          # O request de 100m reserva a linha de base sem travar o agendamento em nó pequeno;
          # o limit de 1 CPU absorve picos (com 500m a mesma carga caiu de ~6000 para ~2200 req/s).
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          # Processo no ar. O heap fica na readiness.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
