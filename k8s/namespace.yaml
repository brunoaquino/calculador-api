# Namespace da API. As labels de Pod Security Admission exigem o perfil restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: calculador
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/name: calculador-api
    app.kubernetes.io/part-of: calculador
