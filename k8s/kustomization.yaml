apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: calculador

labels:
  - pairs:
      app.kubernetes.io/name: calculador-api
      app.kubernetes.io/instance: calculador-api
      app.kubernetes.io/part-of: calculador
      app.kubernetes.io/component: api
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml

# Imagem padrão. O mesmo item aceita newName, newTag e digest.
# Com digest preenchido, o kustomize ignora newTag.
# `make deploy IMAGE=repo:tag` grava só a tag (remove digest da cópia).
# `make deploy IMAGE=repo@sha256:...` ou `IMAGE=repo:tag@sha256:...` grava o digest.
images:
  - name: calculador-api
    newName: ghcr.io/brunoaquino/calculador-api
    newTag: "1.2.0"
    digest: sha256:49083783b7b58a7003c56733cf969f55a0b994220d768b9dbb64d044dcde0133
